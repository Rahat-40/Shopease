spring.application.name=ShopEase Backend

# =========================================================
# DATABASE
# =========================================================
# These values will come from Render Environment Variables.
#
# Local development example:
# DB_URL=jdbc:mysql://localhost:3306/Shopease_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#
# Production:
# DB_URL=jdbc:mysql://YOUR_HOST:3306/Shopease_db?useSSL=true&serverTimezone=UTC

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# =========================================================
# JPA & HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# =========================================================
# SERVER
# =========================================================
# Render provides PORT automatically.
# Local machine will use 8080 if PORT is not defined.
server.port=${PORT:8080}

# =========================================================
# JWT
# =========================================================
jwt.secret=${JWT_SECRET}

# =========================================================
# FILE UPLOAD
# =========================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================================================
# SSLCOMMERZ SANDBOX
# =========================================================
sslcommerz.store.id=${SSLCOMMERZ_STORE_ID}
sslcommerz.store.password=${SSLCOMMERZ_STORE_PASSWORD}

sslcommerz.api.initiate=https://sandbox.sslcommerz.com/gwprocess/v4/api.php
sslcommerz.api.validation=https://sandbox.sslcommerz.com/validator/api/validationserverAPI.php

# =========================================================
# SHOP EASE URLS
# =========================================================

# Public Spring Boot backend URL
# Example:
# https://shopease-backend.onrender.com
app.base.url=${APP_BASE_URL}

# Public React frontend URL
# Example:
# https://shopease.vercel.app
app.frontend.url=${FRONTEND_URL}

# =========================================================
# CLOUDINARY
# =========================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}